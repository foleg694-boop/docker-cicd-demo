name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t my-app .
      
      - name: Run container
        run: |
          docker run -d -p 8080:80 --name test-container my-app
          sleep 2
      
      - name: Check server is alive
        run: curl -f http://localhost:8080
      
      - name: Check specific phrase
        run: |
          if curl -s http://localhost:8080 | grep -q "UNIQUE_PHRASE_ABC123"; then
            echo "✅ Фраза найдена! Тест пройден."
          else
            echo "❌ Фраза не найдена! Тест провален."
            exit 1
          fi
      - name: Check heading
        run: |
          if curl -s http://localhost:8080 | grep -q "Добро пожаловать"; then
            echo "✅ Заголовок найден!"
          else
            echo "❌ Заголовок не найден!"
            exit 1
          fi
      - name: Cleanup
        run: |
          docker stop test-container
          docker rm test-container
  